<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoverDrop - TikTok Cover Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#bbb;
  font-size:14px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.panel{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px #00000012;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
  margin:6px 4px 0 0;
}

.primary{
  background:#111;
  color:white;
}

.secondary{
  background:#e9e9eb;
  color:#111;
}

.preview{
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ddd;
  border-radius:15px;
  padding:15px;
}

canvas{
  width:min(100%,360px);
  aspect-ratio:9/16;
  background:#222;
  border-radius:10px;
  object-fit:contain;
}

.templates{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.templates button{
  flex:1;
  min-width:90px;
}

.range-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.range-row input{
  flex:1;
}

.value{
  width:45px;
  font-size:13px;
  text-align:right;
}

.footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>CoverDrop</h1>
  <p>TikTok Cover Maker</p>
</header>

<div class="container">

  <div class="panel">

    <label>Upload Photo</label>
    <input type="file" id="photo" accept="image/*">

    <label>Cover Title</label>
    <input id="title" type="text" placeholder="Enter your title">

    <label>Username</label>
    <input id="username" type="text" placeholder="@username">

    <label>Template</label>

    <div class="templates">
      <button class="secondary" onclick="setTemplate(1)">Template 1</button>
      <button class="secondary" onclick="setTemplate(2)">Template 2</button>
      <button class="secondary" onclick="setTemplate(3)">Template 3</button>
    </div>

    <label>Title Size</label>
    <div class="range-row">
      <input id="size" type="range" min="35" max="110" value="65">
      <span class="value" id="sizeValue">65</span>
    </div>

    <button class="primary" onclick="downloadCover()">⬇ Download PNG</button>
    <button class="secondary" onclick="resetAll()">Reset</button>

  </div>

  <div class="panel">
    <h3>Preview</h3>

    <div class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>

  </div>

</div>

<div class="footer">
  © 2026 CoverDrop — TikTok Cover Maker
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const photoInput = document.getElementById("photo");
const titleInput = document.getElementById("title");
const usernameInput = document.getElementById("username");
const sizeInput = document.getElementById("size");
const sizeValue = document.getElementById("sizeValue");

let image = null;
let template = 1;

photoInput.addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    image = new Image();

    image.onload = draw;

    image.src = event.target.result;

  };

  reader.readAsDataURL(file);

});

titleInput.addEventListener("input", draw);
usernameInput.addEventListener("input", draw);

sizeInput.addEventListener("input", function(){

  sizeValue.textContent = this.value;

  draw();

});

function setTemplate(number){

  template = number;

  draw();

}

function draw(){

  ctx.clearRect(0,0,1080,1920);

  /* Background */

  if(image){

    const scale = Math.max(
      1080 / image.width,
      1920 / image.height
    );

    const w = image.width * scale;
    const h = image.height * scale;

    const x = (1080 - w) / 2;
    const y = (1920 - h) / 2;

    ctx.drawImage(image,x,y,w,h);

  }else{

    ctx.fillStyle="#222";
    ctx.fillRect(0,0,1080,1920);

    ctx.fillStyle="#777";
    ctx.font="bold 55px Arial";
    ctx.textAlign="center";
    ctx.fillText("Upload your photo",540,960);

  }

  /* Dark overlay */

  if(template === 1){

    const gradient = ctx.createLinearGradient(0,1100,0,1920);

    gradient.addColorStop(0,"rgba(0,0,0,0)");
    gradient.addColorStop(1,"rgba(0,0,0,.85)");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,1080,1920);

  }

  if(template === 2){

    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.fillRect(0,0,1080,1920);

  }

  if(template === 3){

    const gradient = ctx.createLinearGradient(0,0,0,1920);

    gradient.addColorStop(0,"rgba(0,0,0,.65)");
    gradient.addColorStop(.45,"rgba(0,0,0,0)");
    gradient.addColorStop(1,"rgba(0,0,0,.75)");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,1080,1920);

  }

  /* Title */

  const title = titleInput.value || "Your TikTok Title";

  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font=`bold ${sizeInput.value}px Arial`;

  wrapText(title,540,1500,900,Number(sizeInput.value)+15);

  /* Username */

  const username = usernameInput.value || "@username";

  ctx.font="bold 42px Arial";
  ctx.fillStyle="rgba(255,255,255,.9)";
  ctx.fillText(username,540,1780);

  /* Small CoverDrop branding */

  ctx.font="bold 28px Arial";
  ctx.fillStyle="rgba(255,255,255,.65)";
  ctx.fillText("CoverDrop",540,1840);

}

function wrapText(text,x,y,maxWidth,lineHeight){

  const words=text.split(" ");
  let line="";
  let lines=[];

  for(let n=0;n<words.length;n++){

    const testLine=line+words[n]+" ";
    const metrics=ctx.measureText(testLine);

    if(metrics.width>maxWidth && n>0){

      lines.push(line);
      line=words[n]+" ";

    }else{

      line=testLine;

    }

  }

  lines.push(line);

  const startY=y-(lines.length-1)*lineHeight/2;

  lines.forEach((l,i)=>{

    ctx.fillText(l.trim(),x,startY+i*lineHeight);

  });

}

function downloadCover(){

  const link=document.createElement("a");

  link.download="CoverDrop-TikTok-Cover.png";

  link.href=canvas.toDataURL("image/png");

  link.click();

}

function resetAll(){

  photoInput.value="";
  titleInput.value="";
  usernameInput.value="";
  sizeInput.value=65;
  sizeValue.textContent="65";
  image=null;
  template=1;

  draw();

}

draw();

</script>

</body>
</html>
